    <main class="profile-page">
        <h1>My Lovely Characters ♧</h1>

        <p>Somethings are just worth building.</p>
        <section class="profile-form">
            <h2>Update Profile ♧</h2>
            <form id="update-profile">
                <label for="profilePicture">Profile Image URL (optional)</label>
                <input type="url" id="profilePicture" placeholder="Paste an image link...">

                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter name..." required>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter email..." required>
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password..." required>
                <label for="favBookGenre">Favourite Book Genre</label>
                <select id="favBookGenre" required>
                    <option value="">Choose a genre</option>
                    <option>Fantasy</option>
                    <option>Romance</option>
                    <option>Romantasy</option>
                    <option>Mystery</option>
                    <option>Thriller</option>
                    <option>Contemporary</option>
                    <option>Action</option>
                    <option>Comedy</option>
                    <option>Other</option>
                </select>

                <button type="submit">Update my Character ♧</button>

            </form>
        </section>
        <a href="login.html">Sign out</a>
    </main>
